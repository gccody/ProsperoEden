name: Fork build

# The PS5 app (make package: build/release/PPSA99008) on a GitHub-hosted runner, for a fork
# without the self-hosted `prosperoeden` runner release.yml needs. The checkout goes into a
# subfolder so the sibling repositories the build fetches (../) land in the workspace.
on:
  push:
    branches: ['autoboot-ci']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup || true
          df -h /

      - uses: actions/checkout@v4
        with:
          path: ProsperoEden

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18 llvm-18-dev cmake ninja-build ccache make \
            nasm meson rsync git glslang-tools spirv-tools bison flex curl wget unzip tar \
            python3-venv python3-mako python3-yaml python3-packaging python3-pip pkg-config zlib1g-dev \
            libclang-18-dev libclang-cpp18-dev libclc-18-dev libllvmspirvlib-18-dev llvm-spirv-18
          # RADV's pinned Mesa needs Meson 1.4 or later (Ubuntu 24.04 has 1.3); the build's PATH
          # puts /usr/local/bin first.
          sudo pip3 install --break-system-packages 'meson>=1.4,<2'
          meson --version
          # The SDK wrappers (prospero-clang, prospero-lld) use the newest LLVM installed, up to 21
          # in RADV's SDK fork. Clang 18's PS5 driver gives external declarations default
          # visibility (-fvisibility-externs-nodllstorageclass=default); from Clang 21 it keeps
          # them, so Mesa's hidden weak entry points stay out of the import table. LLVM 18 stays
          # for the host tools ProsperoEden checks.
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          sudo apt-get install --yes llvm-21-dev libclang-21-dev libclang-cpp21-dev libclc-21-dev \
            libpolly-21-dev
          llvm-config-21 --version && ld.lld-21 --version
          cd ProsperoEden && make toolchain

      # Mesa's mesa_clc (built natively against the newest LLVM, now 21) needs the SPIR-V LLVM
      # translator of the same LLVM version; Ubuntu 24.04 packages only 18's.
      - name: SPIR-V LLVM translator 21
        run: |
          git clone -q --depth 1 -b v21.1.9 https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git spirv-translator
          cmake -S spirv-translator -B spirv-translator/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm -DLLVM_SPIRV_BUILD_EXTERNAL=YES \
            -DCMAKE_INSTALL_PREFIX=/usr/local -DBUILD_SHARED_LIBS=ON -DLLVM_INCLUDE_TESTS=OFF
          cmake --build spirv-translator/build -j4
          sudo cmake --install spirv-translator/build
          sudo ldconfig
          pkg-config --modversion LLVMSPIRVLib
          rm -rf spirv-translator

      # Dependencies, RADV and the compiler cache from the last run of this branch: a rebuild
      # after a failure is minutes, not an hour.
      - name: Restore build inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/prosperoeden-deps
            ps5-native-app-boilerplate
            mihawk-vulkan-review
            mihawk-mesa-review
            mihawk-sdk-review
            ProsperoEden/.deps
          key: fork-build-llvm21-${{ hashFiles('ProsperoEden/tools/deps.json') }}-${{ github.run_id }}
          restore-keys: fork-build-llvm21-${{ hashFiles('ProsperoEden/tools/deps.json') }}-

      - name: Build the app (make package)
        id: build
        working-directory: ProsperoEden
        run: make package JOBS=4

      - name: Save build inputs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.cache/prosperoeden-deps
            ps5-native-app-boilerplate
            mihawk-vulkan-review
            mihawk-mesa-review
            mihawk-sdk-review
            ProsperoEden/.deps
          key: fork-build-llvm21-${{ hashFiles('ProsperoEden/tools/deps.json') }}-${{ github.run_id }}

      - name: Symbol diagnostics
        if: failure()
        run: |
          set +e
          for tool in clang clang-18 ld.lld ld.lld-18 objcopy nm; do
            printf '%s: ' "$tool"; command -v "$tool" && "$tool" --version | head -1
          done
          cat ps5-native-app-boilerplate/.deps/native/ps5-payload-sdk/bin/prospero-lld 2>/dev/null | head -20
          for archive in mihawk-vulkan-review/.deps/native/radv-release/lib/libvulkan_radeon.ps5.a \
                         ProsperoEden/build/radv-isolated/libvulkan_radeon.ps5.a; do
            echo "== $archive"
            llvm-readelf-18 -s --wide "$archive" | grep -E 'File:|EnumeratePhysicalDevices' | grep -B1 Enumerate | head -20
          done
          elf=$(ls -t ProsperoEden/build/headless-native/*.elf 2>/dev/null | head -1)
          echo "== $elf"
          llvm-readelf-18 --dyn-syms --wide "$elf" | grep -v ' UND .*sce\|FUNC    GLOBAL DEFAULT  UND [a-z_]*$' | grep UND | head -40

      - name: Upload the app folder
        uses: actions/upload-artifact@v4
        with:
          name: PPSA99008-${{ github.sha }}
          path: ProsperoEden/build/release/PPSA99008
          if-no-files-found: error
          retention-days: 14

      - name: Disk use after the build
        if: always()
        run: df -h /
