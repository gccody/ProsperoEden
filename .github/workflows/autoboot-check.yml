name: Autoboot check

# Builds headless/prosperoeden/autoboot.cpp on a hosted runner and runs its cases
# (tools/ci/check-autoboot.sh). Only the module itself: the full PS5 build needs the
# self-hosted runner (release.yml).
on:
  push:
    branches: ['autoboot', 'autoboot-ci']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install clang and nlohmann/json
        run: sudo apt-get update && sudo apt-get install --yes clang-18 nlohmann-json3-dev libstb-dev
      - name: Autoboot cases
        run: bash tools/ci/check-autoboot.sh
